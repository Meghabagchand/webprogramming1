<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form - Curvy Elegance</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            width: 80%;
            margin: auto;
            padding-top: 50px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f743b5;
            color: #fff;
            padding: 15px 0;
            border-bottom: #e8491d 3px solid;
        }
        header h1 {
            margin: 0;
            text-transform: uppercase;
            text-align: center;
            flex-grow: 1;
        }
        .back-button {
            margin-left: 20px;
        }
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="back-button">
            <a href="curvy.html" class="btn btn-secondary">Back to Home</a>
        </div>
        <h1>Curvy Elegance</h1>
    </header>

    <!-- Bootstrap Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="curvy.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="form.html">Contact Form</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contacts.html">Contact Information</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="order.html">Order Products</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h2>Order Products</h2>
        <form>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="telephone">Telephone</label>
                <input type="tel" class="form-control" id="telephone" placeholder="Enter your telephone number">
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" class="form-control" id="address" placeholder="Enter your address">
            </div>
            <div class="form-group">
                <label for="product">Product</label>
                <select class="form-control" id="product">
                    <option>Select a product</option>
                    <option>Dresses</option>
                    <option>Tops</option>
                    <option>Skirts</option>
                    <option>Accessories</option>
                    <option>Bags</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Order</button>
        </form>
    </div>

    <footer>
        <p>Curvy Elegance &copy; 2024</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
